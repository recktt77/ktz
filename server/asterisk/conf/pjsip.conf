; ═══════════════════════════════════════════════
; PJSIP Transport
; ═══════════════════════════════════════════════

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; ═══════════════════════════════════════════════
; Demo SIP endpoints (for testing with softphones)
; ═══════════════════════════════════════════════

; Template for internal extensions
[endpoint-internal](!)
type = endpoint
context = ai-caller-inbound
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-internal](!)
type = auth
auth_type = userpass

[aor-internal](!)
type = aor
max_contacts = 1
remove_existing = yes

; ═══════════════════════════════════════════════
; Beeline Kazakhstan SIP Trunk
; ═══════════════════════════════════════════════

[beeline]
type = registration
transport = transport-udp
outbound_auth = beeline-auth
server_uri = sip:vpbx-company-2787.CLOUDPBX.BEELINE.KZ
client_uri = sip:9902@vpbx-company-2787.CLOUDPBX.BEELINE.KZ
outbound_proxy = sip:46.227.186.231:6050\;lr
contact_user = 9902
retry_interval = 60
expiration = 300
auth_rejection_permanent = no
line = yes
endpoint = beeline-endpoint

[beeline-auth]
type = auth
auth_type = userpass
username = 9902
password = Sanzhar2006@

[beeline-aor]
type = aor
contact = sip:9902@vpbx-company-2787.CLOUDPBX.BEELINE.KZ
qualify_frequency = 0

[beeline-identify]
type = identify
endpoint = beeline-endpoint
match = 46.227.186.231
match = 77.74.70.81

[beeline-endpoint]
type = endpoint
transport = transport-udp
context = from-beeline
disallow = all
allow = alaw
allow = ulaw
outbound_auth = beeline-auth
aors = beeline-aor
from_domain = vpbx-company-2787.CLOUDPBX.BEELINE.KZ
from_user = 9902
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
outbound_proxy = sip:46.227.186.231:6050\;lr

