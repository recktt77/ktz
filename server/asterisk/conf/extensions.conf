[general]

; ═══════════════════════════════════════════════
; AI-Caller outbound context
; ARI originates here. After answer → AudioSocket bridges audio to GPT.
; ═══════════════════════════════════════════════
[ai-caller-outbound]
; Real KZ mobile numbers +7XXXXXXXXXX
exten => _+7XXXXXXXXXX,1,NoOp(Outbound to ${EXTEN} via Beeline trunk)
 same => n,Set(DIAL_NUM=${EXTEN:1})
 same => n,Dial(PJSIP/${DIAL_NUM}@beeline-endpoint,60)
 same => n,Hangup()

; Real KZ numbers 87XXXXXXXXX
exten => _87XXXXXXXXX,1,NoOp(Outbound to ${EXTEN} via Beeline trunk)
 same => n,Dial(PJSIP/${EXTEN}@beeline-endpoint,60)
 same => n,Hangup()

; Internal SIP extensions (6XXX) — answer locally + AudioSocket
exten => _6XXX,1,NoOp(Internal call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,AudioSocket(${AUDIOSOCKET_UUID},ai-caller:9090)
 same => n,Hangup()

; ═══════════════════════════════════════════════
; Context entered after Beeline call is answered
; The h extension (hangup) is automatic.
; AI-Caller uses ARI ExternalMedia / snoop for audio bridging.
; ═══════════════════════════════════════════════

; ═══════════════════════════════════════════════
; AudioSocket bridge context
; Channel is redirected here by ARI after the call is answered
; ═══════════════════════════════════════════════
[audiosocket-bridge]
exten => s,1,NoOp(AudioSocket bridge for UUID ${AUDIOSOCKET_UUID})
 same => n,AudioSocket(${AUDIOSOCKET_UUID},ai-caller:9090)
 same => n,Hangup()

; ═══════════════════════════════════════════════
; Inbound from Beeline trunk
; ═══════════════════════════════════════════════
[from-beeline]
exten => _X.,1,NoOp(Inbound from Beeline: ${EXTEN})
 same => n,Hangup()

; ═══════════════════════════════════════════════
; Inbound context for registered SIP phones
; ═══════════════════════════════════════════════
[ai-caller-inbound]
exten => _6XXX,1,NoOp(Inbound call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
